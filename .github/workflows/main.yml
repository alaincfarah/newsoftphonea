name: Android CI

on:
  push:
    branches:
      - "cursor/softphone-live-transcription-ab4b"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Build pjproject static libs
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          APP_PLATFORM: android-26
        run: |
          set -euo pipefail

          build_pjproject() {
            local abi="$1"
            export TARGET_ABI="${abi}"
            cd app/src/main/cpp/pjproject
            make distclean || true
            ./configure-android --use-ndk-cflags
            make dep
            make -j"$(nproc)"

            local target_name
            target_name=$(grep '^export TARGET_NAME' build.mak | awk '{print $4}')
            local lib_dir="android/${abi}/lib"
            mkdir -p "${lib_dir}"

            find pjlib/lib pjlib-util/lib pjnath/lib pjmedia/lib pjsip/lib third_party/lib \
              -name "lib*-${target_name}.a" -print0 | \
              while IFS= read -r -d '' lib; do
                base=$(basename "${lib}")
                new="${base/-${target_name}.a/.a}"
                cp "${lib}" "${lib_dir}/${new}"
              done

            cd - >/dev/null
          }

          build_pjproject armeabi-v7a
          build_pjproject arm64-v8a

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
          arguments: ":app:assembleDebug"
