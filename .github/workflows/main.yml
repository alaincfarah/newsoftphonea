name: Android CI

on:
  push:
    branches:
      - "cursor/softphone-live-transcription-ab4b"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Fetch pjproject
        run: |
          rm -rf app/src/main/cpp/pjproject
          git clone --depth 1 https://github.com/pjsip/pjproject.git app/src/main/cpp/pjproject

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
          arguments: ":app:assembleDebug"
